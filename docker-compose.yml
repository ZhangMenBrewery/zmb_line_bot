services:
  db:
    image: mysql:8.0
    container_name: zmb_db
    environment:
      MYSQL_ROOT_PASSWORD: zmb54685508
      MYSQL_DATABASE: zmb_line_bot
      MYSQL_USER: zmb
      MYSQL_PASSWORD: zmb54685508
      TZ: Asia/Taipei
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./backups/backup_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pzmb54685508"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3306:3306"

  web:
    build: .
    container_name: zmb_web
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,uninjured-cesarean-cofounder.ngrok-free.dev
      DATABASE_NAME: zmb_line_bot
      DATABASE_USER: zmb
      DATABASE_PASSWORD: zmb54685508
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
